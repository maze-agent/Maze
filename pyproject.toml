[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-agent"
version = "2.0.0.dev0"
description = "A small, Python-first static DAG runtime built on Ray"
requires-python = ">=3.11"
dependencies = ["ray==2.58.0", "pydantic>=2.13,<3", "PyYAML>=6,<7"]

[project.scripts]
maze = "maze.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
api = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1"]
llm = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["maze*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
